services:
  postgres:
    image: postgres:16-alpine
    container_name: smartwater-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smartwater_db}
      POSTGRES_USER: ${DB_USERNAME:-smartwater_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartwater_dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-smartwater_user} -d ${DB_NAME:-smartwater_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: smartwater-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI for reviewing sent emails

volumes:
  postgres_data:
    driver: local
